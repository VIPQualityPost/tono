[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tono"
version = "0.1.0"
description = "Node-based image analysis app with a Python backend and React frontend."
readme = "GWYDDION_FEATURE_GAP.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "gwyfile>=0.2",
    "igor>=0.3",
    "matplotlib>=3.8,<4",
    "nanonispy>=1.1",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    "scikit-image>=0.22,<1",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
]
desktop = [
    "pyinstaller>=6,<7",
    "pywebview>=5,<6",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/nodes/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
