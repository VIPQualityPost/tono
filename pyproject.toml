[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tono"
version = "1.2.1"
description = "topographical node-based image analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gwyfile>=0.2",
    "h5py>=3.10,<4",
    "igor>=0.3",
    "nanonispy>=1.1",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    "pywavelets>=1.8.0",
    "scikit-image>=0.22,<1",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
server = [
    "aiohttp>=3.9,<4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
]
desktop = [
    "pyinstaller>=6,<7",
    "pywebview>=5,<6",
]
icons = [
    "svglib>=1.6.0",
    "reportlab>=4.4.0",
]

[project.scripts]
tono = "backend.main:main"

[tool.setuptools]
py-modules = ["tono"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/nodes/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
