name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # ${{ github.ref_name }} is the tag name (e.g. v1.1.0) on release
          # events, or the branch name on manual dispatch.
          echo "$SSH_KEY" > key && chmod 600 key
          ssh -o StrictHostKeyChecking=no -i key "${USER}@${HOST}" bash -s -- "${{ github.ref_name }}" <<'REMOTE'
            set -e
            TAG="$1"
            cd /opt/tono
            git fetch --tags origin
            git checkout "$TAG"
            uv pip install -e ".[server]" --quiet
            cd frontend && npm ci --ignore-scripts && npm run build && cd ..
            sudo systemctl restart tono
          REMOTE
          rm key
