name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach binaries to (e.g. v1.3.0)"
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            build_cmd: npm run build:mac
            artifact_path: desktop-dist/tono.dmg
            artifact_name: tono-macos
            release_files: desktop-dist/tono.dmg

          - os: ubuntu-latest
            label: Linux
            build_cmd: npm run build:linux
            artifact_path: desktop-dist/tono-linux.tar.gz
            artifact_name: tono-linux
            release_files: desktop-dist/tono-linux.tar.gz

          - os: windows-latest
            label: Windows
            build_cmd: npm run build:windows
            artifact_path: desktop-dist
            artifact_name: tono-windows
            release_files: desktop-dist/tono.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv --python 3.13

      # Linux: pywebview needs webkit2gtk headers to import during PyInstaller collection
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 \
            libwebkit2gtk-4.1-dev \
            gir1.2-webkit2-4.1

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Install frontend Node dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        run: ${{ matrix.build_cmd }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      # Attach the binary to a release so it shows up on the release page
      # (workflow artifacts expire after 90 days and stay hidden inside the
      # run). --clobber makes re-runs idempotent. Target resolution: the
      # release event that triggered this workflow, or the release_tag input
      # on a manual dispatch. A manual run without release_tag skips.
      - name: Attach binary to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "No release target: manual run without 'release_tag' input. Nothing to attach."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' not found. Publish it first (Releases -> New release -> Publish), then re-run."
            exit 1
          fi
          gh release upload "$TAG" \
            ${{ matrix.release_files }} \
            --clobber
